<!DOCTYPE html>

<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px 10px; }
.paper { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); padding: 30px; }
h1 { text-align: center; color: #c00; margin-bottom: 10px; font-size: 1.5em; }
.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: .9em; }

#info-bar { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 25px; }
#info-bar .field { display: flex; flex-direction: column; align-items: flex-start; width: 75%; }
#info-bar label { font-weight: bold; margin-bottom: 3px; color: #333; }
#info-bar input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }

.btn { display: inline-block; padding: 10px 28px; background: #c00; color: #fff; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; transition: background .2s; }
.btn:hover { background: #a00; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #666; }
.btn-secondary:hover { background: #555; }

#memorize-page { display: none; }
#memorize-page h2 { color: #c00; margin-bottom: 15px; }
#memo-controls { margin-bottom: 15px; text-align: center; }
#memo-list { list-style: none; padding: 0; }
#memo-list li { padding: 10px 14px; margin-bottom: 8px; background: #fafafa; border-left: 3px solid #c00; border-radius: 4px; line-height: 1.8; }
#memo-list li .kw-blank { color: transparent; background: #333; border-radius: 2px; padding: 0 4px; margin: 0 2px; }
#memo-list li .kw-blank.revealed { color: #c00; background: transparent; font-weight: bold; padding: 0; }

#quiz-page { display: none; }
#quiz-page h2 { color: #c00; margin-bottom: 15px; }
#progress-bar { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
#progress-fill { height: 100%; background: #c00; width: 0%; transition: width .3s; }
#timer { text-align: right; color: #666; margin-bottom: 10px; font-size: .9em; }
#questions { margin-bottom: 20px; }
.q-item { margin-bottom: 18px; padding: 12px; border: 1px solid #eee; border-radius: 4px; }
.q-item.correct { border-color: #0a0; background: #f0fff0; }
.q-item.wrong { border-color: #c00; background: #fff5f5; }
.q-item .q-text { font-weight: bold; margin-bottom: 8px; }
.q-item input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin: 4px 4px 4px 0; }
.q-item .opts label { display: block; padding: 6px; cursor: pointer; }
.q-item .opts label:hover { background: #f5f5f5; }
.q-item .ref-answer { margin-top: 8px; padding: 8px; background: #fffbe6; border-radius: 4px; font-size: .9em; display: none; }
.q-item .sub-inputs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.q-item .sub-inputs input { width: 120px; }
#submit-area { text-align: center; margin-top: 20px; }

#result { display: none; text-align: center; padding: 30px; }
#result h2 { color: #c00; margin-bottom: 20px; }
#result .score { font-size: 2.5em; color: #c00; font-weight: bold; margin: 15px 0; }
#result .info-line { margin: 8px 0; font-size: 1.1em; }
#result .wrong-list { text-align: left; max-width: 600px; margin: 20px auto; padding: 15px; background: #fff5f5; border-radius: 4px; }
#result .wrong-list h3 { color: #c00; margin-bottom: 10px; }
#result .wrong-list li { margin-bottom: 6px; }

@media (max-width: 600px) {
  .paper { padding: 15px; }

  .q-item .sub-inputs input { width: 100%; }

<div class="paper">

    </div>

    </div>

    <div id="memo-controls">
      <button class="btn btn-secondary" id="btn-toggle-kw">显示关键词</button>
      <button class="btn" id="btn-start-quiz" style="margin-left:10px;">开始答题</button>
    </div>
    <ul id="memo-list"></ul>
  </div>

  <div id="quiz-page">
    <h2>✏️ 答题中</h2>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="timer">用时：00:00</div>
    <div id="questions"></div>
    <div id="submit-area">
      <button class="btn" id="btn-submit">提交试卷</button>

  </div>

  <div id="result">

    <div class="info-line" id="result-name"></div>
    <div class="info-line" id="result-cls"></div>
    <div class="info-line" id="result-no"></div>
    <div class="info-line" id="result-detail"></div>
    <div id="wrong-area"></div>
    <button class="btn" id="btn-retry" style="margin-top:20px;">重做一份（重新抽题）</button>
  </div>
</div>

  {type:'choice',q:'戊戌变法历时（　　）',a:'B',opts:['A.100天','B.103天','C.108天','D.110天'],lesson:6},
  {type:'choice',q:'戊戌变法失败的标志是（　　）',a:'B',opts:['A.光绪帝被囚','B.戊戌政变','C.谭嗣同被杀','D.维新派逃亡'],lesson:6},
  {type:'choice',q:'戊戌变法中甘愿为变法流血牺牲的是（　　）',a:'C',opts:['A.康有为','B.梁启超','C.谭嗣同','D.杨锐'],lesson:6},
  {type:'choice',q:'戊戌变法的性质是（　　）',a:'B',opts:['A.地主阶级自救运动','B.资产阶级改良运动','C.资产阶级革命运动','D.农民战争'],lesson:6},
  {type:'choice',q:'戊戌变法开始的标志是（　　）',a:'A',opts:['A.光绪帝颁布《定国是诏》','B.公车上书','C.强学会成立','D.保国会成立'],lesson:6},
];

// 知识点列表
var KPOINTS = BANK.map(function(item) {
  if (item.type === 'fill') {
    return { text: item.q, answers: item.a.split('|'), isChoice: false };
  } else {
    var correctIdx = item.a.charCodeAt(0) - 65;
    var correctText = item.opts[correctIdx] ? item.opts[correctIdx].substring(2) : '';
    return { text: item.q + '（正确答案：______）', answers: [correctText], isChoice: true };
  }
});

var currentQuiz = [];
var startTime = 0;
var timerInterval = null;
var kwRevealed = false;

var elCls = document.getElementById('cls');
var elNm = document.getElementById('nm');
var elNo = document.getElementById('no');
var btnStartMemo = document.getElementById('btn-start-memo');
var memoPage = document.getElementById('memorize-page');
var memoList = document.getElementById('memo-list');
var btnToggleKw = document.getElementById('btn-toggle-kw');
var btnStartQuiz = document.getElementById('btn-start-quiz');
var quizPage = document.getElementById('quiz-page');
var questionsDiv = document.getElementById('questions');
var progressFill = document.getElementById('progress-fill');
var timerDiv = document.getElementById('timer');
var btnSubmit = document.getElementById('btn-submit');
var resultDiv = document.getElementById('result');
var btnRetry = document.getElementById('btn-retry');

function checkInfo() {
  btnStartMemo.disabled = !(elCls.value.trim() && elNm.value.trim() && elNo.value.trim());
}
elCls.addEventListener('input', checkInfo);
elNm.addEventListener('input', checkInfo);
elNo.addEventListener('input', checkInfo);

btnStartMemo.addEventListener('click', function() {
  document.getElementById('info-bar').style.display = 'none';
  memoPage.style.display = 'block';
  document.getElementById('memo-total').textContent = KPOINTS.length;
  renderMemo();
  kwRevealed = false;
  btnToggleKw.textContent = '显示关键词';
});

function renderMemo() {
  memoList.innerHTML = '';
  for (var i = 0; i < KPOINTS.length; i++) {
    var li = document.createElement('li');
    var kp = KPOINTS[i];
    if (!kp.isChoice && kp.answers.length > 0) {
      var html = '';
      var parts = kp.text.split('______');
      for (var j = 0; j < parts.length; j++) {
        html += escapeHtml(parts[j]);
        if (j < kp.answers.length) {
          html += '<span class="kw-blank" data-ans="' + escapeHtml(kp.answers[j]) + '">　　　　</span>';
        }
      }
      li.innerHTML = (i+1) + '. ' + html;
    } else if (kp.isChoice) {
      // 选择题：题干 + 遮罩的答案
      var qText = kp.text.replace('（正确答案：______）', '');
      li.innerHTML = (i+1) + '. ' + escapeHtml(qText) + '（正确答案：<span class="kw-blank" data-ans="' + escapeHtml(kp.answers[0]) + '">　　　　</span>）';
    }
    memoList.appendChild(li);
  }
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

btnToggleKw.addEventListener('click', function() {
  var blanks = memoList.querySelectorAll('.kw-blank');
  if (!kwRevealed) {
    for (var i = 0; i < blanks.length; i++) {
      var ans = blanks[i].getAttribute('data-ans');
      if (ans) {
        blanks[i].textContent = ans;
        blanks[i].classList.add('revealed');
      }
    }
    btnToggleKw.textContent = '隐藏关键词';
    kwRevealed = true;
  } else {
    for (var i = 0; i < blanks.length; i++) {
      blanks[i].textContent = '　　　　';
      blanks[i].classList.remove('revealed');
    }
    btnToggleKw.textContent = '显示关键词';
    kwRevealed = false;
  }
});

btnStartQuiz.addEventListener('click', function() {
  memoPage.style.display = 'none';
  quizPage.style.display = 'block';
  startQuiz();
});

function startQuiz() {
  currentQuiz = shuffle(BANK.slice()).slice(0, 30);
  questionsDiv.innerHTML = '';
  startTime = Date.now();

  for (var i = 0; i < currentQuiz.length; i++) {
    var q = currentQuiz[i];
    var div = document.createElement('div');
    div.className = 'q-item';
    div.id = 'q-' + i;

    var qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = (i+1) + '. ' + q.q;
    div.appendChild(qText);

    if (q.type === 'fill') {
      var ansArr = q.a.split('|');
      if (ansArr.length === 1) {
        // 单空
        var input = document.createElement('input');
        input.type = 'text';
        input.id = 'ans-' + i + '-0';
        input.placeholder = '请填写答案';
        input.addEventListener('input', updateProgress);
        div.appendChild(input);
      } else {
        // 多空：拆成独立输入框
        var subDiv = document.createElement('div');
        subDiv.className = 'sub-inputs';
        for (var s = 0; s < ansArr.length; s++) {
          var subInput = document.createElement('input');
          subInput.type = 'text';
          subInput.id = 'ans-' + i + '-' + s;
          subInput.placeholder = '第' + (s+1) + '空';
          subInput.addEventListener('input', updateProgress);
          subDiv.appendChild(subInput);
        }
        div.appendChild(subDiv);
      }
    } else {
      var optsDiv = document.createElement('div');
      optsDiv.className = 'opts';
      for (var j = 0; j < q.opts.length; j++) {
        var letter = String.fromCharCode(65+j);
        var label = document.createElement('label');
        label.innerHTML = '<input type="radio" name="ans-' + i + '" value="' + letter + '" onchange="updateProgress()"> ' + q.opts[j];
        optsDiv.appendChild(label);
      }
      div.appendChild(optsDiv);
    }

    var refDiv = document.createElement('div');
    refDiv.className = 'ref-answer';
    refDiv.id = 'ref-' + i;
    if (q.type === 'choice') {
      var correctIdx = q.a.charCodeAt(0) - 65;
      refDiv.textContent = '正确答案：' + q.a + '．' + (q.opts[correctIdx] ? q.opts[correctIdx].substring(2) : '');
    } else {
      refDiv.textContent = '正确答案：' + q.a.replace(/\|/g, '、');
    }
    div.appendChild(refDiv);

    questionsDiv.appendChild(div);
  }

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
  updateProgress();
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
  }
  return arr;
}

function updateTimer() {
  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  timerDiv.textContent = '用时：' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
}

function updateProgress() {
  var answered = 0;
  for (var i = 0; i < currentQuiz.length; i++) {
    var q = currentQuiz[i];
    if (q.type === 'fill') {
      var ansArr = q.a.split('|');
      if (ansArr.length === 1) {
        var input = document.getElementById('ans-' + i + '-0');
        if (input && input.value.trim()) answered++;
      } else {
        var filled = 0;
        for (var s = 0; s < ansArr.length; s++) {
          var si = document.getElementById('ans-' + i + '-' + s);
          if (si && si.value.trim()) filled++;
        }
        if (filled > 0) answered++;
      }
    } else {
      var radios = document.querySelectorAll('input[name="ans-' + i + '"]:checked');
      if (radios.length > 0) answered++;
    }
  }
  progressFill.style.width = Math.round(answered / currentQuiz.length * 100) + '%';
}

btnSubmit.addEventListener('click', function() {
  var unanswered = 0;
  for (var i = 0; i < currentQuiz.length; i++) {
    var q = currentQuiz[i];
    if (q.type === 'fill') {
      var ansArr = q.a.split('|');
      if (ansArr.length === 1) {
        var input = document.getElementById('ans-' + i + '-0');
        if (!input || !input.value.trim()) unanswered++;
      } else {
        var allEmpty = true;
        for (var s = 0; s < ansArr.length; s++) {
          var si = document.getElementById('ans-' + i + '-' + s);
          if (si && si.value.trim()) { allEmpty = false; break; }
        }
        if (allEmpty) unanswered++;
      }
    } else {
      var radios = document.querySelectorAll('input[name="ans-' + i + '"]:checked');
      if (radios.length === 0) unanswered++;
    }
  }

  if (unanswered > 0) {
    if (!confirm('还有 ' + unanswered + ' 题未作答，确定要提交吗？')) return;
  }

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  var totalScore = 0;
  var correctCount = 0;
  var wrongList = [];

  for (var i = 0; i < currentQuiz.length; i++) {
    var q = currentQuiz[i];
    var div = document.getElementById('q-' + i);
    var isCorrect = false;
    var pts = (i < 25) ? 3 : 5;

    if (q.type === 'fill') {
      var ansArr = q.a.split('|');
      if (ansArr.length === 1) {
        var input = document.getElementById('ans-' + i + '-0');
        var userAns = input ? input.value.trim() : '';
        if (userAns === q.a) {
          totalScore += pts;
          correctCount++;
          isCorrect = true;
        }
      } else {
        // 多空：每空单独计分
        var subPts = pts / ansArr.length;
        var subCorrect = 0;
        for (var s = 0; s < ansArr.length; s++) {
          var si = document.getElementById('ans-' + i + '-' + s);
          var sv = si ? si.value.trim() : '';
          if (sv === ansArr[s]) {
            subCorrect++;
          }
        }
        var earned = subCorrect * subPts;
        totalScore += earned;
        if (subCorrect === ansArr.length) {
          correctCount++;
          isCorrect = true;
        }
      }
    } else {
      var checked = document.querySelector('input[name="ans-' + i + '"]:checked');
      var userAns = checked ? checked.value : '';
      if (userAns === q.a) {
        totalScore += pts;
        correctCount++;
        isCorrect = true;
      }
    }

    if (isCorrect) {
      div.classList.add('correct');
    } else {
      div.classList.add('wrong');
      var refDiv = document.getElementById('ref-' + i);
      if (refDiv) refDiv.style.display = 'block';

      var displayCorrect = '';
      if (q.type === 'choice') {
        var correctIdx = q.a.charCodeAt(0) - 65;
        displayCorrect = q.a + '．' + (q.opts[correctIdx]||'').substring(2);
      } else {
        displayCorrect = q.a.replace(/\|/g,'、');
      }

      wrongList.push({
        idx: i+1,
        q: q.q,
        correct: displayCorrect
      });
    }
  }

  // 四舍五入总分
  totalScore = Math.round(totalScore);

  quizPage.style.display = 'none';
  resultDiv.style.display = 'block';

  document.getElementById('final-score').textContent = totalScore + ' / 100';
  document.getElementById('result-name').textContent = '姓名：' + elNm.value.trim();
  document.getElementById('result-cls').textContent = '班级：' + elCls.value.trim();
  document.getElementById('result-no').textContent = '座号：' + elNo.value.trim();

  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  document.getElementById('result-detail').textContent = '正确：' + correctCount + '/' + currentQuiz.length + '　用时：' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');

  if (wrongList.length === 0) {
    document.getElementById('wrong-area').innerHTML = '<div style="color:#0a0;font-weight:bold;margin-top:15px;">全部正确，满分！</div>';
  } else {
    var html = '<div class="wrong-list"><h3>错题明细</h3><ul>';
    for (var w = 0; w < wrongList.length; w++) {
      html += '<li><b>第' + wrongList[w].idx + '题</b>：' + wrongList[w].q + '<br>正确答案：' + wrongList[w].correct + '</li>';
    }
    html += '</ul></div>';
    document.getElementById('wrong-area').innerHTML = html;
  }
});

btnRetry.addEventListener('click', function() {
  resultDiv.style.display = 'none';
  memoPage.style.display = 'block';
  kwRevealed = false;
  btnToggleKw.textContent = '显示关键词';
  renderMemo();
});
</script>
</body>
</html>
